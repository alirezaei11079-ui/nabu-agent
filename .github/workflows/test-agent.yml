name: Nabu Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "7/5 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Nabu Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save monitor state
        run: |
          git config user.name "nabu-agent"
          git config user.email "nabu-agent@users.noreply.github.com"
          git add telegram_state.json
          git diff --cached --quiet || git commit -m "Update Telegram monitor state"
          git push
