name: Test X Monitor

on:
  workflow_dispatch:

jobs:
  test-x:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run X Monitor
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python x_monitor.py

      - name: Save X monitor state
        run: |
          git config user.name "nabu-agent"
          git config user.email "nabu-agent@users.noreply.github.com"
          git add x_state.json
          git diff --cached --quiet || git commit -m "Update X monitor state"
          git push


